<!doctype html>
<html lang="en" data-app-theme="light">
  <head>
    <meta charset="UTF-8" />

    <!-- No production domain was known at authoring time, so every absolute
         URL below (og:url, og:image, twitter:image, canonical, JSON-LD
         "url") uses https://your-domain-here.example as a placeholder.
         Once deployed, search the repo for "your-domain-here.example" and
         replace every occurrence — including public/sitemap.xml — with the
         real origin. Most crawlers require absolute URLs to render previews. -->

    <!-- Same brand mark everywhere: the SVG is the source of truth, with
         rasterized copies for surfaces that can't use it (old browsers,
         iOS home screen, Android install, social link previews). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://your-domain-here.example/" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />

    <title>VS Code Theme Studio — Build a Custom VS Code Color Theme Visually</title>
    <meta
      name="description"
      content="Assign your own colors to real syntax categories across 13 languages and export a genuinely installable VS Code theme extension (.vsix) — no JSON editing, ever. Free, open-source, runs entirely in your browser."
    />
    <meta
      name="keywords"
      content="VS Code theme, VS Code color theme generator, VSIX builder, syntax highlighting theme, custom VS Code theme, TextMate scopes, code editor theme maker"
    />
    <meta name="author" content="VS Code Theme Studio" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain-here.example/" />
    <meta property="og:site_name" content="VS Code Theme Studio" />
    <meta property="og:title" content="VS Code Theme Studio — Build a Custom VS Code Color Theme Visually" />
    <meta
      property="og:description"
      content="Assign your own colors to real syntax categories across 13 languages and export a genuinely installable VS Code theme extension."
    />
    <!-- og:image/twitter:image must be absolute URLs for most crawlers to
         render a preview — replace the placeholder domain once deployed
         (see the note at the top of <head>). -->
    <meta property="og:image" content="https://your-domain-here.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VS Code Theme Studio — a code editor preview with a color picker assigning syntax colors" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VS Code Theme Studio — Build a Custom VS Code Color Theme Visually" />
    <meta
      name="twitter:description"
      content="Assign your own colors to real syntax categories across 13 languages and export a genuinely installable VS Code theme extension."
    />
    <meta name="twitter:image" content="https://your-domain-here.example/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VS Code Theme Studio",
        "url": "https://your-domain-here.example/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Assign your own colors to real syntax categories across 13 languages and export a genuinely installable VS Code theme extension — no JSON editing, ever.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
