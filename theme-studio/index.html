<!doctype html>
<html lang="en" data-app-theme="light">
  <head>
    <meta charset="UTF-8" />

    <!-- GitHub Pages (the current deploy target — see deploy-pages.yml)
         can't send custom HTTP response headers at all, so this is the only
         way to ship a Content-Security-Policy or Referrer-Policy here.
         Two real gaps this can't close, both server-header-only by spec:
         `frame-ancestors` is ignored entirely when CSP is delivered via
         <meta> (no clickjacking protection), and there's no equivalent for
         X-Content-Type-Options or Permissions-Policy. Closing those needs
         an actual HTTP header — i.e. moving off GitHub Pages (Vercel/
         Netlify, whose configs already sit alongside this app, would send
         all of them) or fronting it with something like Cloudflare.
         connect-src/img-src include the Marketplace search feature's two
         real endpoints: the gallery query API and its per-publisher CDN.
         script-src needs 'wasm-unsafe-eval' — vscode-oniguruma's
         WebAssembly.instantiate() call for the TextMate tokenizer is
         blocked without it (verified live: the editor fails to load with
         it omitted). It permits compiling WASM only, not arbitrary
         eval()/Function() — 'unsafe-eval' is not used here.
         default-src/connect-src/frame-src all need `blob:` for the .vsix
         export download (downloadBlob in src/vsix/buildVsix.ts): Safari,
         unlike Chrome/Firefox, enforces CSP against the blob: URL an
         `<a download>` click fetches — and without it silently fails the
         download and instead navigates the tab to the blob: URL, which it
         can't render (zip content) — "Safari Can't Open the Page" /
         WebKitBlobResource error 1. Real-world Safari reports of this exact
         failure name `frame-src` as the directive actually checked (see
         e.g. https://community.shopify.com/t/pdf-download-not-working-in-safari-browser-ios-for-shopify-embedded-app/75459),
         which this policy never declared — it was silently falling back
         through child-src to default-src, and WebKit versions are
         inconsistent about honoring that chain for this specific case. All
         three carry `blob:` explicitly instead of relying on any one
         directive or the fallback chain. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.gallerycdn.vsassets.io; font-src 'self'; connect-src 'self' blob: https://marketplace.visualstudio.com https://*.gallerycdn.vsassets.io; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Absolute URLs below (og:url, og:image, twitter:image, canonical,
         JSON-LD "url") point at the GitHub Pages project-site origin for
         this repo (2917hs-org/theme-studio → 2917hs-org.github.io/theme-studio/),
         matching the --base the deploy workflow builds with. If this repo
         is ever renamed or moved to a custom domain, update every
         occurrence here and in public/sitemap.xml + public/robots.txt —
         most crawlers require absolute URLs to render previews. -->

    <!-- Same brand mark everywhere: the SVG is the source of truth, with
         rasterized copies for surfaces that can't use it (old browsers,
         iOS home screen, Android install, social link previews). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://2917hs-org.github.io/theme-studio/" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />

    <title>VS Code Theme Studio — Build a Custom VS Code Color Theme Visually</title>
    <meta
      name="description"
      content="Assign your own colors to real syntax categories across 13 languages and export a genuinely installable VS Code theme extension (.vsix) — no JSON editing, ever. Free, open-source, runs entirely in your browser."
    />
    <meta
      name="keywords"
      content="VS Code theme, VS Code color theme generator, VSIX builder, syntax highlighting theme, custom VS Code theme, TextMate scopes, code editor theme maker, VS Code icon theme"
    />
    <meta name="author" content="VS Code Theme Studio" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://2917hs-org.github.io/theme-studio/" />
    <meta property="og:site_name" content="VS Code Theme Studio" />
    <meta property="og:title" content="VS Code Theme Studio — Build a Custom VS Code Color Theme Visually" />
    <meta
      property="og:description"
      content="Assign your own colors to real syntax categories across 13 languages and export a genuinely installable VS Code theme extension."
    />
    <meta property="og:image" content="https://2917hs-org.github.io/theme-studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VS Code Theme Studio — a code editor preview with a color picker assigning syntax colors" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VS Code Theme Studio — Build a Custom VS Code Color Theme Visually" />
    <meta
      name="twitter:description"
      content="Assign your own colors to real syntax categories across 13 languages and export a genuinely installable VS Code theme extension."
    />
    <meta name="twitter:image" content="https://2917hs-org.github.io/theme-studio/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VS Code Theme Studio",
        "url": "https://2917hs-org.github.io/theme-studio/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Assign your own colors to real syntax categories across 13 languages and export a genuinely installable VS Code theme extension — no JSON editing, ever.",
        "featureList": [
          "Assign colors to real TextMate syntax scopes across 13 languages",
          "Live Monaco editor preview using VS Code's own grammars",
          "Import and remix color themes from the VS Code Marketplace",
          "Pair your theme with an existing Marketplace icon theme",
          "Export a genuinely installable VS Code theme extension (.vsix)"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
