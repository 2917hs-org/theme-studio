name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

# A new push to the same branch/PR supersedes the previous run, so we don't
# burn minutes finishing a check that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: theme-studio
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/verify
        with:
          working-directory: theme-studio

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: theme-studio/dist
          retention-days: 7
