name: Deploy to GitHub Pages

on:
  push:
    # `release` is the stable branch that's actually live — main is active
    # dev and doesn't publish anything on its own.
    branches: [release]
  # Lets you trigger a redeploy from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a new push cancels an in-flight one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theme-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: theme-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      # GitHub Pages serves a project site from a subpath
      # (<owner>.github.io/<repo>/), not the domain root, so the build's
      # `base` has to match the actual repo name — computed here instead of
      # hardcoded, so a future repo rename can't leave this silently wrong.
      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npx vite build --base="/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: theme-studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
