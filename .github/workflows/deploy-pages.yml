name: Deploy to GitHub Pages

on:
  push:
    # `release` is the stable branch that's actually live — main is active
    # dev and doesn't publish anything on its own.
    branches: [release]
  # Lets you trigger a redeploy from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a new push cancels an in-flight one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: theme-studio
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/verify
        with:
          working-directory: theme-studio

      # GitHub Pages serves a project site from a subpath
      # (<owner>.github.io/<repo>/), not the domain root, so the build's
      # `base` has to match the actual repo name — computed here instead of
      # hardcoded, so a future repo rename can't leave this silently wrong.
      - name: Build
        run: npx vite build --base="/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: theme-studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
